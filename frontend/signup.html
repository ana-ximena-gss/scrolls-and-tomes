<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrolls & Tomes - Sign Up</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: "Trebuchet MS", "Lucida Sans Unicode", sans-serif;

      background:
        linear-gradient(rgba(5, 5, 10, 0.3), rgba(5, 5, 10, 0.4)),
        url("images/homepageBackgroud.png");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      overflow: hidden;
    }

    .signup-container {
      width: 100%;
      max-width: 480px;

      padding: 3rem;

      border-radius: 18px;

      background: rgba(20, 18, 35, 0.72);

      border: 1px solid rgba(138, 107, 219, 0.35);

      backdrop-filter: blur(10px);

      box-shadow:
        0 0 20px rgba(0, 0, 0, 0.8),
        0 0 40px rgba(138, 107, 219, 0.25);

      text-align: center;
    }

    .signup-header h2 {
      font-size: 3rem;

      color: #f1e8ff;

      margin-bottom: 0.8rem;

      letter-spacing: 3px;

      text-shadow:
        0 0 10px rgba(186, 143, 255, 0.8),
        0 0 20px rgba(138, 107, 219, 0.6);
    }

    .signup-header p {
      color: #cfc2f5;

      font-size: 1.1rem;

      margin-bottom: 2.5rem;

      text-shadow: 0 0 8px rgba(0,0,0,0.8);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    input,
    select {
      width: 100%;

      padding: 1rem 1.2rem;

      border-radius: 10px;

      border: 1px solid rgba(138, 107, 219, 0.4);

      background: rgba(255, 255, 255, 0.08);

      color: #f1e8ff;

      font-size: 1rem;

      outline: none;

      transition: all 0.3s ease;
    }

    input::placeholder {
      color: #b8abd9;
    }

    select {
      color: #f1e8ff;
      cursor: pointer;
    }

    select option {
      background: #171325;
      color: #f1e8ff;
    }

    input:focus,
    select:focus {
      border-color: #a67cff;

      background: rgba(255, 255, 255, 0.12);

      box-shadow:
        0 0 10px rgba(166, 124, 255, 0.4),
        0 0 20px rgba(166, 124, 255, 0.2);
    }

    .submit-btn {
      margin-top: 1rem;

      padding: 1rem;

      border: none;
      border-radius: 10px;

      background: rgba(111, 86, 168, 0.85);

      color: #f1e8ff;

      font-size: 1.1rem;
      font-weight: bold;

      letter-spacing: 1px;

      cursor: pointer;

      transition: all 0.3s ease;

      box-shadow:
        0 0 10px rgba(138, 107, 219, 0.3);
    }

    .submit-btn:hover {
      transform: scale(1.03);

      background: rgba(138, 107, 219, 0.95);

      box-shadow:
        0 0 20px rgba(138, 107, 219, 0.7),
        0 0 40px rgba(138, 107, 219, 0.3);
    }

    .submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div class="signup-container">

    <div class="signup-header">
      <h2>Sign Up</h2>
      <p>Begin your journey through the Arcane Archives</p>
    </div>

    <form id="signupForm">

      <input
        type="text"
        id="username"
        placeholder="Enter Username"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Enter Password"
        required
      >

      <select id="major" required>
        <option value="" disabled selected>
          Select your Major
        </option>

        <option value="business">Business</option>
        <option value="engineering">Engineering</option>
        <option value="arts">Arts</option>
        <option value="medicine">Medicine</option>
      </select>

      <button type="submit" class="submit-btn">
        Begin Journey
      </button>

    </form>

  </div>

  <script>
    document.getElementById("signupForm").addEventListener("submit", async (e) => {

      e.preventDefault();

      const username =
        document.getElementById("username").value;

      const password =
        document.getElementById("password").value;

      const major =
        document.getElementById("major").value;

      const submitBtn =
        document.querySelector(".submit-btn");

      submitBtn.textContent = "Creating...";
      submitBtn.disabled = true;

      try {

        const res = await fetch("/signup", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            username,
            password,
            major
          })
        });

        const text = await res.text();

        if (text === "User created") {

          alert("Character Created! Redirecting to login...");

          window.location.href = "/login.html";

        } else {

          alert(text);
        }

      } catch (err) {

        alert("The Arcane Archives are currently unreachable.");

      } finally {

        submitBtn.textContent = "Begin Journey";
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
