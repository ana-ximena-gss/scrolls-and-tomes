<script>
async function loadLeaderboard() {
    try {
        const res = await fetch("/leaderboard");
        // Fallback mock data in case the fetch fails during testing
        const data = res.ok ? await res.json() : [
            {username: "Da man", rank: "Master", xp: 750},
            {username: "testUserA", rank: "Bronze", xp: 5},
            {username: "testUser", rank: "Bronze", xp: 0}
        ];

        const list = document.getElementById("leaderboardList");

        if (data.length === 0) {
            list.innerHTML = "<li>No save data found...</li>";
            return;
        }

        data.forEach((user, index) => {
            const li = document.createElement("li");
            // Wrapped in spans for table-like spacing in flexbox
            li.innerHTML = `
                <span class="username">${index + 1}. ${user.username}</span> 
                <span class="rank">Lvl.${user.rank}</span> 
                <span class="xp">${user.xp} XP</span>
            `;
            list.appendChild(li);
        });

    } catch (error) {
        console.error("Error loading leaderboard:", error);
    }
}
