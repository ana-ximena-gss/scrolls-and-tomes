<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scrolls & Tomes</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: url("images/homepageBackgroud.png");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      font-family: "Trebuchet MS", "Lucida Sans Unicode", sans-serif;
      color: #c5bcf0;

      height: 100vh;
      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;

      text-align: center;
      position: relative;
    }

    /* =========================================
      SPREAD MAGICAL LIGHT STREAKS
    ========================================== */

    .light-container {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .light-streak {
      position: absolute;

      top: -10%;

      width: 3px;
      height: 60vh;

      border-radius: 999px;

      transform-origin: top center;

      background:
        linear-gradient(
          to bottom,

          rgba(255,255,255,0) 0%,

          rgba(255,255,255,0.72) 8%,

          rgba(255,255,255,0.48) 24%,

          rgba(255,235,255,0.22) 48%,

          rgba(255,220,255,0.08) 72%,

          rgba(255,220,255,0.02) 90%,

          transparent 100%
        );

      opacity: 0;

      filter: blur(1.1px);

      mix-blend-mode: screen;

      box-shadow:
        0 0 8px rgba(255,255,255,0.45),
        0 0 18px rgba(255,220,255,0.18);

      animation:
        streakMove linear infinite,
        streakGlow ease-in-out infinite;
    }

    /* SLIGHTLY BIGGER */
    .s1 {
      width: 2px;
    }

    .s2 {
      width: 3px;
    }

    .s3 {
      width: 4px;
    }

    /* SOFTER SHIMMER */
    @keyframes streakGlow {
      0% {
        opacity: 0.08;
      }

      50% {
        opacity: 0.72;
      }

      100% {
        opacity: 0.08;
      }
    }

    /* FASTER MOVEMENT */
    @keyframes streakMove {
      0% {
        transform:
          translateX(0px)
          rotate(var(--angle));
      }

      100% {
        transform:
          translateX(-42px)
          rotate(calc(var(--angle) - 1.5deg));
      }
    }

    /* DIFFERENT THICKNESSES */
    .s1 { width: 0.7px; }
    .s2 { width: 1.2px; }
    .s3 { width: 1.8px; }

    /* SHIMMER */
    @keyframes streakGlow {
      0% {
        opacity: 0.04;
      }

      50% {
        opacity: 0.95;
      }

      100% {
        opacity: 0.04;
      }
    }

    /* MOVEMENT */
    @keyframes streakMove {
      0% {
        transform:
          translateX(0px)
          rotate(var(--angle));
      }

      100% {
        transform:
          translateX(-42px)
          rotate(calc(var(--angle) - 1.5deg));
      }
    }

    /* =========================================
       FLOWER EMBERS
    ========================================== */

    .embers {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 2;
    }

    .ember {
      position: absolute;
      bottom: -10px;

      width: 2px;
      height: 2px;

      border-radius: 50%;

      opacity: 0;

      animation: floatUp linear infinite;

      background:
        radial-gradient(circle, #ff9cff 0%, #d935d2 60%, transparent 100%);

      box-shadow:
        0 0 4px #ff7cf8,
        0 0 8px #d935d2,
        0 0 14px #8f3dff;
    }

    .ember:nth-child(3n) {
      width: 3px;
      height: 3px;
    }

    .ember:nth-child(4n) {
      width: 1px;
      height: 1px;
    }

    .ember:nth-child(5n) {
      background:
        radial-gradient(circle, #ffffff 0%, #ffc8ff 50%, transparent 100%);
    }

    @keyframes floatUp {
      0% {
        transform:
          translateY(0)
          translateX(0)
          scale(1);

        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      60% {
        opacity: 0.9;
      }

      100% {
        transform:
          translateY(-220px)
          translateX(var(--drift))
          scale(0.2);

        opacity: 0;
      }
    }

    /* =========================================
       CONTENT
    ========================================== */

    .content {
      position: relative;
      z-index: 5;
    }

    h1 {
      font-size: 5rem;
      color: #f1e8ff;

      letter-spacing: 4px;
      margin-bottom: 1rem;

      text-shadow:
        0 0 10px rgba(186, 143, 255, 0.8),
        0 0 20px rgba(138, 107, 219, 0.7),
        0 0 40px rgba(138, 107, 219, 0.5);
    }

    p {
      font-size: 1.6rem;
      color: #d2c7f0;

      margin-bottom: 3rem;

      text-shadow:
        0 0 8px rgba(0, 0, 0, 0.8);
    }

    .button-container {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    a {
      color: #f1e8ff;
      text-decoration: none;

      font-size: 1.2rem;
      font-weight: bold;

      padding: 14px 32px;

      border-radius: 10px;
      border: 1px solid #6f56a8;

      background-color: rgba(74, 59, 114, 0.35);

      backdrop-filter: blur(4px);

      transition: all 0.3s ease;

      box-shadow:
        0 0 10px rgba(0,0,0,0.7),
        0 0 15px rgba(138, 107, 219, 0.2);
    }

    a:hover {
      background-color: rgba(111, 86, 168, 0.85);

      transform: scale(1.05);

      text-shadow: 0 0 8px #fff;

      box-shadow:
        0 0 20px rgba(138, 107, 219, 0.8),
        0 0 40px rgba(138, 107, 219, 0.5);
    }
  </style>
</head>
