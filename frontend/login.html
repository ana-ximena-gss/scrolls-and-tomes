<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrolls & Tomes - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Trebuchet MS", "Lucida Sans Unicode", sans-serif;

            background:
                linear-gradient(rgba(5, 5, 10, 0.3), rgba(5, 5, 10, 0.4)),
                url("images/homepageBackgroud.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            overflow: hidden;
        }

        .login-container {
            width: 100%;
            max-width: 450px;

            padding: 3rem;

            border-radius: 18px;

            background: rgba(20, 18, 35, 0.72);

            border: 1px solid rgba(138, 107, 219, 0.35);

            backdrop-filter: blur(10px);

            box-shadow:
                0 0 20px rgba(0, 0, 0, 0.8),
                0 0 40px rgba(138, 107, 219, 0.25);

            text-align: center;
        }

        .login-header h2 {
            font-size: 3rem;

            color: #f1e8ff;

            margin-bottom: 0.8rem;

            letter-spacing: 3px;

            text-shadow:
                0 0 10px rgba(186, 143, 255, 0.8),
                0 0 20px rgba(138, 107, 219, 0.6);
        }

        .login-header p {
            color: #cfc2f5;

            font-size: 1.1rem;

            margin-bottom: 2.5rem;

            text-shadow: 0 0 8px rgba(0,0,0,0.8);
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group input {
            width: 100%;

            padding: 1rem 1.2rem;

            border-radius: 10px;

            border: 1px solid rgba(138, 107, 219, 0.4);

            background: rgba(255, 255, 255, 0.08);

            color: #f1e8ff;

            font-size: 1rem;

            outline: none;

            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: #b8abd9;
        }

        .input-group input:focus {
            border-color: #a67cff;

            background: rgba(255, 255, 255, 0.12);

            box-shadow:
                0 0 10px rgba(166, 124, 255, 0.4),
                0 0 20px rgba(166, 124, 255, 0.2);
        }

        .submit-btn {
            width: 100%;

            margin-top: 1rem;

            padding: 1rem;

            border: none;
            border-radius: 10px;

            background: rgba(111, 86, 168, 0.85);

            color: #f1e8ff;

            font-size: 1.1rem;
            font-weight: bold;

            letter-spacing: 1px;

            cursor: pointer;

            transition: all 0.3s ease;

            box-shadow:
                0 0 10px rgba(138, 107, 219, 0.3);
        }

        .submit-btn:hover {
            transform: scale(1.03);

            background: rgba(138, 107, 219, 0.95);

            box-shadow:
                0 0 20px rgba(138, 107, 219, 0.7),
                0 0 40px rgba(138, 107, 219, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #errorMessage {
            display: none;

            margin-top: 1.5rem;

            padding: 0.9rem;

            border-radius: 8px;

            background: rgba(120, 20, 20, 0.25);

            border: 1px solid rgba(255, 80, 80, 0.35);

            color: #ffb3b3;

            font-size: 0.95rem;

            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-header">
            <h2>Login</h2>
            <p>Enter the Arcane </p>
        </div>

        <form id="loginForm">

            <div class="input-group">
                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required
                    autocomplete="off"
                >
            </div>

            <div class="input-group">
                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >
            </div>

            <button type="submit" class="submit-btn">
                Enter
            </button>

            <div id="errorMessage">
                Invalid username or password.
            </div>

        </form>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            const errorDiv = document.getElementById("errorMessage");
            const submitBtn = document.querySelector(".submit-btn");

            errorDiv.style.display = "none";

            submitBtn.textContent = "Verifying...";
            submitBtn.disabled = true;

            try {
                const res = await fetch("/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username,
                        password
                    })
                });

                const data = await res.json();

                if (res.ok && data.message === "Login successful") {

                    localStorage.setItem("username", data.username);
                    localStorage.setItem("major", data.major);

                    window.location.href = "/dashboard.html";

                } else {

                    errorDiv.textContent =
                        data.message || "Authentication failed.";

                    errorDiv.style.display = "block";
                }

            } catch (err) {

                errorDiv.textContent =
                    "The servers are currently unreachable.";

                errorDiv.style.display = "block";

            } finally {

                submitBtn.textContent = "Enter";
                submitBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
