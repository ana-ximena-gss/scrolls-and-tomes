<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Scrolls & Tomes - Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    /* =========================================================================
      GLOBAL & LAYOUT
      ========================================================================= */

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      color: #f3ecff;

      /* KEEP ORIGINAL FUNCTIONAL LAYOUT */
      overflow: hidden;

      /* NEW MAGICAL BACKGROUND */
      background:
        linear-gradient(rgba(8, 8, 18, 0.55), rgba(8, 8, 18, 0.72)),
        url("images/homepageBackgroud.png");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      position: relative;
    }

    /* soft magical glow overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;

      background:
        radial-gradient(circle at 20% 20%, rgba(145, 92, 255, 0.18), transparent 30%),
        radial-gradient(circle at 80% 30%, rgba(93, 169, 255, 0.14), transparent 30%),
        radial-gradient(circle at 50% 80%, rgba(180, 120, 255, 0.10), transparent 35%);
    }

    /* floating sparkles */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;

      background-image:
        radial-gradient(circle, rgba(255,255,255,0.8) 1px, transparent 1px),
        radial-gradient(circle, rgba(180,120,255,0.5) 1px, transparent 1px),
        radial-gradient(circle, rgba(93,169,255,0.4) 1px, transparent 1px);

      background-size: 180px 180px, 260px 260px, 340px 340px;
      animation: sparkleMove 30s linear infinite;
      opacity: 0.35;
    }
    /* =========================================================
      ENHANCED MAGICAL GLITTER
    ========================================================= */

    body .magic-glitter {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    /* FAR LAYER */
    body .magic-glitter::before,

    /* MID LAYER */
    body .magic-glitter::after {
      content: "";

      position: absolute;
      inset: -30%;

      background-image:
        radial-gradient(circle, rgba(255,255,255,1) 0.7px, transparent 1.4px),
        radial-gradient(circle, rgba(180,120,255,0.95) 1px, transparent 2px),
        radial-gradient(circle, rgba(93,169,255,0.9) 1px, transparent 2px),
        radial-gradient(circle, rgba(255,255,255,0.6) 2px, transparent 3px);

      background-size:
        90px 90px,
        140px 140px,
        180px 180px,
        260px 260px;

      mix-blend-mode: screen;

      animation:
        glitterFloat 24s linear infinite,
        glitterTwinkle 4s ease-in-out infinite alternate;

      opacity: 0.65;

      filter:
        drop-shadow(0 0 6px rgba(255,255,255,0.4))
        drop-shadow(0 0 12px rgba(180,120,255,0.35));
    }

    /* NEAR LAYER */
    body .magic-glitter::after {
      animation-duration: 16s, 2.5s;

      transform: scale(1.15) rotate(8deg);

      opacity: 0.9;

      filter:
        drop-shadow(0 0 10px rgba(255,255,255,0.65))
        drop-shadow(0 0 18px rgba(145,92,255,0.45));
    }

    /* EXTRA DEPTH LAYER */
    .magic-glitter span {
      position: absolute;
      inset: -20%;

      background-image:
        radial-gradient(circle, rgba(255,255,255,0.9) 1px, transparent 1px);

      background-size: 70px 70px;

      opacity: 0.35;

      animation:
        glitterDrift 12s linear infinite,
        glitterPulse 2s ease-in-out infinite alternate;

      mix-blend-mode: screen;
    }

    /* FLOATING MOTION */
    @keyframes glitterFloat {
      from {
        transform: translateY(0px) translateX(0px);
      }

      to {
        transform: translateY(-220px) translateX(-40px);
      }
    }

    /* SECONDARY MOTION */
    @keyframes glitterDrift {
      from {
        transform: translateY(0px) translateX(0px);
      }

      to {
        transform: translateY(-140px) translateX(30px);
      }
    }

    /* TWINKLE EFFECT */
    @keyframes glitterTwinkle {
      0% {
        opacity: 0.35;
      }

      25% {
        opacity: 0.9;
      }

      50% {
        opacity: 0.45;
      }

      75% {
        opacity: 1;
      }

      100% {
        opacity: 0.55;
      }
    }

    /* SPARK PULSE */
    @keyframes glitterPulse {
      from {
        opacity: 0.15;
        transform: scale(1);
      }

      to {
        opacity: 0.45;
        transform: scale(1.04);
      }
    }

    @keyframes sparkleMove {
      from {
        transform: translateY(0px);
      }
      to {
        transform: translateY(-120px);
      }
    }

    /* IMPORTANT: keep app above overlays */
    .container-fluid,
    .row,
    .sidebar,
    .main,
    .topbar,
    .content,
    .card-custom {
      position: relative;
      z-index: 2;
    }

    .container-fluid,
    .row {
      height: 100%;
    }

    .row {
      display: flex;
      flex-wrap: nowrap;
    }

    .main {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 0;
      flex-grow: 1;
      min-width: 0;
    }

    .content {
      flex-grow: 1;
      padding: 20px;
      display: flex;
      min-height: 0;
      min-width: 0;
    }

    /* =========================================================================
      SIDEBAR
      ========================================================================= */

    .sidebar {
      height: 100%;

      background: rgba(12, 16, 32, 0.72);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-right: 1px solid rgba(151, 115, 255, 0.4);

      padding: 20px;

      display: flex;
      flex-direction: column;

      transition: width 0.3s ease;

      width: 260px;
      flex-shrink: 0;

      box-shadow:
        0 0 30px rgba(125, 92, 255, 0.18),
        inset 0 0 20px rgba(255,255,255,0.02);
    }

    .sidebar.collapsed {
      width: 80px;
      padding: 20px 10px;
    }

    .sidebar h2 {
      font-family: 'Cinzel', serif;
      color: #d7c3ff;
      font-size: 22px;

      text-shadow:
        0 0 10px rgba(180, 120, 255, 0.6),
        0 0 20px rgba(93, 169, 255, 0.35);

      transition: opacity 0.2s;
    }

    .sidebar.collapsed h2 {
      opacity: 0;
    }

    .sidebar.collapsed .nav-btn {
      font-size: 0;
      padding: 12px;
    }

    .nav-section {
      margin-top: 20px;
      flex-grow: 1;
    }

    /* =========================================================================
      BUTTONS & NAV
      ========================================================================= */

    .nav-btn {
      width: 100%;
      margin-bottom: 10px;

      background: rgba(255,255,255,0.03);

      border: 1px solid rgba(145, 92, 255, 0.35);

      color: #f3ecff;

      padding: 12px;

      border-radius: 12px;

      transition: all 0.25s ease;

      white-space: nowrap;

      backdrop-filter: blur(10px);
    }

    .nav-btn:hover {
      background: rgba(145, 92, 255, 0.18);

      border-color: rgba(180, 120, 255, 0.7);

      transform: translateX(3px);

      box-shadow: 0 0 15px rgba(145, 92, 255, 0.25);
    }

    .nav-btn.active {
      background: linear-gradient(
        135deg,
        rgba(145, 92, 255, 0.95),
        rgba(93, 169, 255, 0.9)
      );

      color: white;
      font-weight: bold;

      border: none;

      box-shadow:
        0 0 20px rgba(145, 92, 255, 0.45),
        0 0 30px rgba(93, 169, 255, 0.2);
    }

    .divider {
      border-top: 1px solid rgba(180, 120, 255, 0.2);
      margin: 10px 0;
    }

    .toggle-btn {
      background: rgba(255,255,255,0.04);

      border: 1px solid rgba(145, 92, 255, 0.35);

      color: #d7c3ff;

      padding: 6px 12px;

      border-radius: 10px;

      cursor: pointer;

      transition: 0.25s;
    }

    .toggle-btn:hover {
      background: rgba(145, 92, 255, 0.18);
    }

    .btn-primary {
      background: linear-gradient(135deg, #915cff, #5da9ff);
      border: none;
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-accent {
      background: linear-gradient(135deg, #c16dff, #915cff);
      border: none;
    }

    /* =========================================================================
      TOPBAR
      ========================================================================= */

    .topbar {
      height: 70px;

      background:
        linear-gradient(
          to right,
          rgba(16, 20, 40, 0.78),
          rgba(26, 18, 48, 0.78)
        );

      backdrop-filter: blur(18px);

      border-bottom: 1px solid rgba(145, 92, 255, 0.18);

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 20px;

      position: relative;

      overflow: hidden;
    }

    /* magical glow strip */
    .topbar::before {
      content: "";

      position: absolute;
      top: -60%;
      left: 25%;

      width: 50%;
      height: 220%;

      background:
        radial-gradient(
          ellipse,
          rgba(180, 120, 255, 0.22),
          transparent 70%
        );

      filter: blur(40px);

      animation: topGlow 7s ease-in-out infinite alternate;
    }

    @keyframes topGlow {
      from {
        transform: translateX(-40px);
      }

      to {
        transform: translateX(40px);
      }
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;

      position: relative;
      z-index: 2;
    }

    .avatar {
      width: 42px;
      height: 42px;

      border-radius: 50%;

      background: linear-gradient(135deg, #915cff, #5da9ff);

      display: flex;
      align-items: center;
      justify-content: center;

      font-weight: bold;
      color: white;

      box-shadow:
        0 0 15px rgba(145, 92, 255, 0.45),
        0 0 30px rgba(93, 169, 255, 0.2);
    }

    .user-name {
      font-size: 14px;
      font-weight: bold;
    }

    .user-guild {
      font-size: 12px;
      opacity: 0.7;
    }

    /* =========================================================================
      CARD / PANELS
      ========================================================================= */

    .card-custom {
      background: rgba(15, 18, 36, 0.66);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      border: 1px solid rgba(145, 92, 255, 0.28);

      border-radius: 20px;

      padding: 20px;

      box-shadow:
        0 0 30px rgba(93, 169, 255, 0.12),
        0 0 50px rgba(145, 92, 255, 0.08);

      display: flex;
      flex-direction: column;

      flex-grow: 1;

      min-height: 0;
    }

    .section-title {
      font-family: 'Cinzel', serif;

      font-size: 28px;

      color: #e3d4ff;

      text-shadow:
        0 0 12px rgba(180, 120, 255, 0.55),
        0 0 20px rgba(93, 169, 255, 0.2);

      margin-bottom: 14px;
    }

    /* =========================================================================
      CHAT
      ========================================================================= */

    .chat-box {
      flex-grow: 1;

      overflow-y: auto;

      background: rgba(8, 10, 20, 0.55);

      border: 1px solid rgba(145, 92, 255, 0.18);

      padding: 15px;

      border-radius: 14px;

      margin-bottom: 15px;

      min-height: 0;
    }

    /* KEEP ORIGINAL FLEX BEHAVIOR */
    .chat-content {
      display: flex;
      flex-grow: 1;
      gap: 10px;
      min-height: 0;
    }

    .chat-messages {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      transition: all 0.3s ease;
    }

    .chat-users {
      width: 0;
      overflow: hidden;

      transition: width 0.3s ease;

      background: rgba(10, 14, 28, 0.85);

      border-left: 1px solid rgba(145, 92, 255, 0.35);

      border-radius: 12px;

      padding: 0;
    }

    .chat-users.open {
      width: 220px;
      padding: 10px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    /* =========================================================================
      MESSAGES
      ========================================================================= */

    .msg-wrapper {
      position: relative;

      padding: 12px;

      border-radius: 12px;

      margin-bottom: 8px;

      background: rgba(255,255,255,0.03);

      border: 1px solid rgba(145, 92, 255, 0.08);

      transition: 0.2s;
    }

    .msg-wrapper:hover {
      background: rgba(145, 92, 255, 0.08);

      border-color: rgba(145, 92, 255, 0.2);
    }

    .msg-controls {
      position: absolute;
      right: 10px;
      top: 5px;

      opacity: 0;

      transition: opacity 0.2s;

      background: rgba(10, 14, 24, 0.95);

      border: 1px solid rgba(145, 92, 255, 0.35);

      border-radius: 8px;

      padding: 2px 5px;

      display: flex;
      gap: 5px;
    }

    .msg-wrapper:hover .msg-controls {
      opacity: 1;
    }

    .reaction-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }

    /* =========================================================================
      INPUTS
      ========================================================================= */

    input,
    select,
    textarea {
      background: rgba(16, 22, 40, 0.82) !important;

      color: #f3ecff !important;

      border: 1px solid rgba(145, 92, 255, 0.35) !important;

      border-radius: 12px !important;

      box-shadow: none !important;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #b98dff !important;

      box-shadow:
        0 0 10px rgba(145, 92, 255, 0.25) !important;
    }

    /* =========================================================================
      FILTERS
      ========================================================================= */

    .filter-group,
    .selected-filters {
      background: rgba(16, 20, 36, 0.72);

      backdrop-filter: blur(12px);

      border: 1px solid rgba(145, 92, 255, 0.22);

      border-radius: 16px;

      padding: 12px;
    }

    .filter-title {
      font-size: 13px;
      opacity: 0.75;
      margin-bottom: 8px;
    }

    .filter-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: stretch;
    }

    .filter-pill {
      width: 100%;

      text-align: center;

      border: 1px solid rgba(145, 92, 255, 0.35);

      background: rgba(255,255,255,0.03);

      color: #f3ecff;

      padding: 7px 10px;

      border-radius: 999px;

      font-size: 11px;

      cursor: pointer;

      transition: 0.2s;
    }

    .filter-pill:hover {
      background: rgba(145, 92, 255, 0.15);
    }

    .filter-pill.include {
      background: linear-gradient(135deg, #915cff, #5da9ff);
      color: white;
    }

    .filter-pill.exclude {
      background: linear-gradient(135deg, #ff5d9e, #ff7a5d);
      color: white;
    }

    .filter-chip {
      display: inline-block;

      margin: 4px;

      padding: 4px 10px;

      border-radius: 20px;

      font-size: 12px;

      white-space: nowrap;
    }

    .filter-chip.include {
      background: linear-gradient(135deg, #915cff, #5da9ff);
      color: white;
    }

    .filter-chip.exclude {
      background: linear-gradient(135deg, #ff5d9e, #ff7a5d);
      color: white;
    }

    /* =========================================================================
      QUESTION LIST
      ========================================================================= */

    .question-list {
      flex: 1;

      overflow-y: auto;

      background: rgba(8, 10, 20, 0.55);

      border: 1px solid rgba(145, 92, 255, 0.18);

      border-radius: 14px;

      padding: 12px;

      max-height: 300px;
    }

    /* =========================================================================
      DROPDOWNS
      ========================================================================= */

    .chat-menu {
      display: none;

      position: absolute;

      right: 0;
      top: 28px;

      background: rgba(20, 24, 42, 0.96);

      backdrop-filter: blur(16px);

      border: 1px solid rgba(145, 92, 255, 0.35);

      border-radius: 12px;

      overflow: hidden;

      z-index: 1000;

      min-width: 140px;
    }

    .chat-menu div {
      padding: 10px;
      cursor: pointer;
      font-size: 13px;
    }

    .chat-menu div:hover {
      background: rgba(145, 92, 255, 0.15);
    }

    .chat-dropbtn,
    .active-btn {
      background: rgba(255,255,255,0.03);

      border: 1px solid rgba(145, 92, 255, 0.35);

      color: #f3ecff;

      border-radius: 10px;

      transition: 0.2s;
    }

    .chat-dropbtn:hover,
    .active-btn:hover {
      background: rgba(145, 92, 255, 0.15);
    }
    /* =========================================================
      LEADERBOARD OVERLAY
    ========================================================= */

    .leaderboard-overlay {
      position: fixed;
      inset: 0;

      display: none;
      justify-content: center;
      align-items: center;

      z-index: 99999;

      background:
        radial-gradient(circle at center,
          rgba(145, 92, 255, 0.18),
          rgba(5, 5, 12, 0.82)
        );

      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    /* animated magical particles */
    .leaderboard-overlay::before {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      background-image:
        radial-gradient(circle, rgba(255,255,255,0.8) 1px, transparent 1px),
        radial-gradient(circle, rgba(180,120,255,0.55) 1px, transparent 1px),
        radial-gradient(circle, rgba(93,169,255,0.45) 1px, transparent 1px);

      background-size:
        180px 180px,
        260px 260px,
        340px 340px;

      animation: sparkleMove 25s linear infinite;

      opacity: 0.45;
    }

    .leaderboard-overlay.show {
      display: flex;
    }

    /* =========================================================
      PANEL
    ========================================================= */

    .leaderboard-panel {
      position: relative;

      width: 760px;
      max-width: 92%;

      max-height: 82vh;
      overflow-y: auto;

      padding: 26px;

      /* PIXELATED PANEL STYLE */
      background:
        linear-gradient(
          180deg,
          rgba(28, 18, 60, 0.96) 0%,
          rgba(14, 10, 32, 0.98) 100%
        );

      border: 4px solid #f3ecff;

      border-radius: 10px;

      box-shadow:
        inset 0 0 0 4px rgba(0,0,0,0.85),
        0 0 25px rgba(145,92,255,0.35),
        0 0 70px rgba(93,169,255,0.15),
        12px 12px 0 rgba(0,0,0,0.55);

      backdrop-filter: blur(18px);

      animation: leaderboardAppear 0.35s ease;
    }

    /* glowing magical aura */
    .leaderboard-panel::before {
      content: "";

      position: absolute;
      inset: -3px;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          rgba(145,92,255,0.22),
          rgba(93,169,255,0.10),
          transparent
        );

      filter: blur(14px);

      z-index: -1;
    }

    /* =========================================================
      TITLE
    ========================================================= */

    .leaderboard-panel h1 {
      text-align: center;

      margin-top: 0;
      margin-bottom: 30px;

      font-family: 'Press Start 2P', cursive;

      font-size: 2rem;

      color: #e7d7ff;

      text-transform: uppercase;

      text-shadow:
        0 0 10px rgba(180,120,255,0.8),
        0 0 24px rgba(93,169,255,0.35),
        4px 4px rgba(0,0,0,0.9);

      letter-spacing: 2px;
    }

    /* =========================================================
      CLOSE BUTTON
    ========================================================= */

    .leaderboard-close {
      position: absolute;

      top: 16px;
      right: 16px;

      width: 42px;
      height: 42px;

      border-radius: 8px;

      border: 2px solid rgba(180,120,255,0.4);

      background: rgba(8,8,18,0.9);

      color: #f3ecff;

      font-family: 'Press Start 2P', cursive;

      cursor: pointer;

      transition: all 0.2s ease;
    }

    .leaderboard-close:hover {
      background: rgba(145,92,255,0.2);

      transform: scale(1.08);

      box-shadow:
        0 0 16px rgba(145,92,255,0.45);
    }

    /* =========================================================
      LIST
    ========================================================= */

    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* =========================================================
      ENTRY
    ========================================================= */

    .leaderboard-entry {
      position: relative;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 18px 20px;

      background:
        linear-gradient(
          180deg,
          rgba(42, 26, 82, 0.82),
          rgba(20, 14, 42, 0.9)
        );

      border: 2px solid rgba(145,92,255,0.22);

      border-radius: 6px;

      transition: all 0.18s ease;

      overflow: hidden;
    }

    /* glitter shimmer */
    .leaderboard-entry::before {
      content: "";

      position: absolute;

      top: 0;
      left: -120%;

      width: 80%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,0.08),
          transparent
        );

      transition: 0.7s;
    }

    .leaderboard-entry:hover::before {
      left: 140%;
    }

    .leaderboard-entry:hover {
      transform: translateY(-2px);

      border-color: rgba(180,120,255,0.45);

      background:
        linear-gradient(
          180deg,
          rgba(58, 34, 112, 0.9),
          rgba(24, 18, 52, 0.95)
        );

      box-shadow:
        0 0 16px rgba(145,92,255,0.18);
    }

    /* =========================================================
      TOP PLAYER (LEGENDARY STYLE)
    ========================================================= */

    .leaderboard-entry.top {

      background:
        linear-gradient(
          180deg,
          rgba(255, 215, 90, 0.22),
          rgba(88, 46, 155, 0.96)
        );

      border: 2px solid rgba(255, 220, 120, 0.95);

      box-shadow:
        0 0 18px rgba(255, 215, 120, 0.45),
        0 0 35px rgba(145,92,255,0.28),
        inset 0 0 14px rgba(255,255,255,0.06);

      transform: scale(1.02);

      position: relative;

      overflow: hidden;
    }

    /* GOLDEN SHIMMER */
    .leaderboard-entry.top::after {
      content: "";

      position: absolute;
      top: 0;
      left: -120%;

      width: 70%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,0.35),
          transparent
        );

      transform: skewX(-20deg);

      animation: championShine 4s linear infinite;
    }

    /* CHAMPION ANIMATION */
    @keyframes championShine {
      from {
        left: -120%;
      }

      to {
        left: 160%;
      }
    }

    /* #1 RANK GOLD */
    .leaderboard-entry.top .lb-rank {

      color: #ffd95e;

      text-shadow:
        0 0 8px rgba(255,215,120,0.95),
        0 0 18px rgba(255,215,120,0.65),
        0 0 28px rgba(255,215,120,0.45);

      transform: scale(1.08);
    }

    /* USERNAME GOLDEN GLOW */
    .leaderboard-entry.top .lb-user {

      color: #fff3c4;

      text-shadow:
        0 0 8px rgba(255,215,120,0.85),
        0 0 20px rgba(255,215,120,0.55);
    }

    /* TITLE */
    .leaderboard-entry.top .lb-title {

      color: #ffe08a;

      text-shadow:
        0 0 10px rgba(255,215,120,0.4);
    }

    /* XP GOLD */
    .leaderboard-entry.top .lb-xp {

      color: #ffd95e;

      text-shadow:
        0 0 10px rgba(255,215,120,0.8),
        0 0 24px rgba(255,215,120,0.4);
    }

    /* =========================================================
      LEFT SIDE
    ========================================================= */

    .lb-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .lb-rank {
      font-family: 'Press Start 2P', cursive;

      font-size: 1rem;

      min-width: 60px;

      color: #cda9ff;

      text-shadow:
        0 0 10px rgba(145,92,255,0.45);
    }

    .lb-user {
      font-family: 'Press Start 2P', cursive;

      font-size: 1rem;

      color: #f3ecff;

      text-shadow:
        0 0 8px rgba(145,92,255,0.2);
    }

    .lb-title {
      margin-top: 8px;

      font-family: 'Press Start 2P', cursive;

      font-size: 0.55rem;

      text-transform: uppercase;

      color: #bba8e6;

      opacity: 0.9;

      text-shadow:
        0 0 8px rgba(180,120,255,0.22);
    }

    /* =========================================================
      XP
    ========================================================= */

    .lb-xp {
      font-family: 'Press Start 2P', cursive;

      font-size: 0.9rem;

      color: #7bc6ff;

      text-shadow:
        0 0 12px rgba(93,169,255,0.45);
    }

    /* =========================================================================
      TOOLTIPS / REACTIONS
      ========================================================================= */

    .tooltip-container {
      position: relative;
      display: inline-block;
    }

    .tooltip-text {
      visibility: hidden;

      position: absolute;
      top: 135%;
      left: 0;

      z-index: 99999;

      background: rgba(14, 18, 34, 0.96);

      color: #fff;

      border: 1px solid rgba(145, 92, 255, 0.45);

      border-radius: 10px;

      padding: 8px 10px;

      font-size: 11px;

      white-space: nowrap;

      opacity: 0;

      transition: opacity 0.2s ease;

      backdrop-filter: blur(12px);

      pointer-events: none;

      box-shadow:
        0 0 14px rgba(145, 92, 255, 0.25),
        0 0 25px rgba(93, 169, 255, 0.08);
    }

    .tooltip-container:hover .tooltip-text {
      visibility: visible;
      opacity: 1;
    }

    /* reaction bubble style */

    .reaction-btn {
      background: rgba(255,255,255,0.04);

      border: 1px solid rgba(145, 92, 255, 0.2);

      color: white;

      border-radius: 999px;

      padding: 4px 8px;

      transition: 0.2s ease;

      cursor: pointer;
    }

    .reaction-btn:hover {
      background: rgba(145, 92, 255, 0.18);

      transform: scale(1.08);

      box-shadow:
        0 0 12px rgba(145, 92, 255, 0.25);
    }

    /* =========================================================================
      MY QUESTIONS FIX
      ========================================================================= */

    #myQuestionsSection {
      display: flex;
      flex-direction: column;

      min-height: 0;

      overflow: hidden;
    }

    #myQuestionsList {
      flex: 1;

      overflow-y: auto;

      min-height: 0;

      padding-right: 6px;

      margin-top: 10px;
    }

    /* custom scrollbar */

    #myQuestionsList::-webkit-scrollbar,
    .question-list::-webkit-scrollbar,
    .chat-box::-webkit-scrollbar,
    .leaderboard-panel::-webkit-scrollbar {
      width: 8px;
    }

    #myQuestionsList::-webkit-scrollbar-thumb,
    .question-list::-webkit-scrollbar-thumb,
    .chat-box::-webkit-scrollbar-thumb,
    .leaderboard-panel::-webkit-scrollbar-thumb {
      background:
        linear-gradient(
          180deg,
          rgba(145,92,255,0.9),
          rgba(93,169,255,0.9)
        );

      border-radius: 999px;
    }

    #myQuestionsList::-webkit-scrollbar-track,
    .question-list::-webkit-scrollbar-track,
    .chat-box::-webkit-scrollbar-track,
    .leaderboard-panel::-webkit-scrollbar-track {
      background: transparent;
    }

    /* =========================================================================
      QUESTION LIST FIX
      ========================================================================= */

    .question-list {
      flex: 1;

      min-height: 0;

      overflow-y: auto;

      overflow-x: hidden;

      background: rgba(8, 10, 20, 0.55);

      border: 1px solid rgba(145, 92, 255, 0.18);

      border-radius: 14px;

      padding: 12px;

      max-height: 300px;
    }

    /* =========================================================================
      MY QUESTION CARDS
      ========================================================================= */

    #myQuestionsList > div {
      background:
        linear-gradient(
          180deg,
          rgba(32, 22, 64, 0.82),
          rgba(18, 14, 38, 0.92)
        );

      border: 1px solid rgba(145, 92, 255, 0.25) !important;

      border-radius: 14px !important;

      padding: 14px !important;

      margin-bottom: 14px !important;

      transition: 0.25s ease;
    }

    #myQuestionsList > div:hover {
      transform: translateY(-2px);

      border-color: rgba(180,120,255,0.55) !important;

      box-shadow:
        0 0 18px rgba(145,92,255,0.18);
    }

    /* =========================================================================
      CHAT MESSAGE GLOW IMPROVEMENT
      ========================================================================= */

    .msg-wrapper {
      backdrop-filter: blur(8px);

      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.015);
    }

    .msg-wrapper:hover {
      box-shadow:
        0 0 18px rgba(145,92,255,0.12),
        inset 0 0 0 1px rgba(255,255,255,0.04);
    }


  </style>
</head>

<body>
  <div class="magic-glitter">

  <div class="container-fluid">
    <div class="row">

            </div>
            <div class="avatar" id="avatar"></div>
          </div>
        </div>

        <div class="content">
          <div id="chatSection" style="display:flex; gap:10px; width:100%; height:100%;">
            <div id="chatMain" class="card-custom" style="flex:1; min-width:0;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <div class="section-title" id="chatTitle">World Chat</div>
                <div style="display:flex; align-items:center; gap:10px;">
                  <button class="active-btn" onclick="toggleActivePanel()">👥 <span id="activeCount">0</span></button>
                  <div class="chat-dropdown">
                    <button class="chat-dropbtn" onclick="toggleRoomMenu()">▾</button>
                    <div id="roomMenu" class="chat-menu">

              </div>
              <div class="chat-content">
                <div class="chat-messages">
                  <div class="chat-box" id="chatBox">
                    <p style="opacity:.6;">💬 Guild chat will appear here</p>
                  </div>
                </div>
                <div id="activeUsersPanel" class="chat-users">
                  <div class="section-title" style="font-size:16px;">Active Users</div>
                  <div id="activeUsersList"></div>
                </div>
              </div>
              <div class="input-row">
                <textarea id="chatInput" class="form-control" placeholder="Type a message..." rows="2"></textarea>
                <button class="btn btn-primary" onclick="sendMessage()">Send</button>
              </div>
            </div>
          </div>

          <div id="questionsSection" class="card-custom" style="display:none;">
            
            <div style="display:flex; gap:16px; margin-bottom:15px; align-items:stretch;">

                <!-- CATEGORY -->
                <div class="filter-group" id="categoryFilter" style="flex:0.8;">
                  <div class="filter-title">Category</div>
                  <div class="filter-options" style="flex-direction:column;">
                    <button class="filter-pill" data-value="math">Math</button>
                    <button class="filter-pill" data-value="engineering">Engineering</button>
                    <button class="filter-pill" data-value="business">Business</button>
                    <button class="filter-pill" data-value="arts">Arts</button>

                <!-- DIFFICULTY -->
                <div class="filter-group" id="difficultyFilter" style="flex:0.8;">
                  <div class="filter-title">Difficulty</div>

                    <button class="filter-pill" data-value="easy">Easy</button>
                    <button class="filter-pill" data-value="medium">Medium</button>

                <!-- GUILD -->
                <div class="filter-group" id="guildFilter" style="flex:0.8;">
                  <div class="filter-title">Guild</div>
                  <div class="filter-options" style="flex-direction:column;">
                    <button class="filter-pill" data-value="engineering">Mage</button>
                    <button class="filter-pill" data-value="business">Merchant</button>
                    <button class="filter-pill" data-value="arts">Artisan</button>
                    <button class="filter-pill" data-value="medicine">Healer</button>
                  </div>
                </div>

              <!-- RIGHT COLUMN (SELECTED FILTERS) -->
              <div class="selected-filters" style="flex:2;">
                <div class="filter-title">Selected Filters</div>

                <div style="margin-bottom:10px;">
                  <strong style="color:#5da9ff;">Include:</strong>
                  <div id="includeFilters" style="display:flex; flex-wrap:wrap;"></div>
                </div>

                <div>
                  <strong style="color:#ff5d5d;">Exclude:</strong>
                  <div id="excludeFilters" style="display:flex; flex-wrap:wrap;"></div>

              </div>

            </div>

            <div style="margin-bottom:10px; display:flex; gap:15px; flex-wrap:wrap;">
              <label>
                <input type="checkbox" id="excludeAnswered">
                Hide already answered
              </label>
            </div>

            <div class="section-title">Answer Questions</div>

            <div id="questionList" class="question-list">
              <p style="opacity:.6;">Click search to load questions</p>
            </div>

            <button class="btn btn-primary mt-2" onclick="startQuestions()">
              Search Questions
            </button>

            </div>

          <div id="answerSingleSection" class="card-custom" style="display:none;">
            <div class="section-title">Answer Question</div>

            <p id="singleQuestionText"></p>

            <input type="text" id="singleAnswerInput" class="form-control" placeholder="Type your answer...">

            <button class="btn btn-accent mt-2" onclick="submitSingleAnswer()">Submit Answer</button>
            <button class="btn btn-secondary mt-2" onclick="backToSearch()">⬅ Back to Questions</button>

            <p id="singleResultText"></p>
          </div>

          <div id="createSection" class="card-custom" style="display:none;">
            <div class="section-title">Create Question</div>
            <label style="margin-bottom:4px; opacity:0.8;">Question</label>
            <input type="text" id="newQuestion" class="form-control mb-2" placeholder="Enter the question">
            <label style="margin-bottom:4px; opacity:0.8;">Answer</label>
            <input type="text" id="newAnswer" class="form-control mb-2" placeholder="Enter the correct answer">
            <select id="newDifficulty" class="form-control mb-2">
              <option value="easy">Easy</option>
              <option value="medium">Medium</option>
              <option value="hard">Hard</option>

            <select id="newCategory" class="form-control mb-2">
              <option value="math">Math</option>
              <option value="engineering">Engineering</option>
              <option value="business">Business</option>
              <option value="arts">Arts</option>

            <button class="btn btn-primary" onclick="submitQuestion()">Submit</button>
            <p id="createResult"></p>

          <div id="myQuestionsSection" class="card-custom" style="display:none; min-height:0;">

  <!-- =========================================================
        LEADERBOARD MODAL
    ========================================================= -->

    <div id="leaderboardModal" class="leaderboard-overlay">

      <div class="leaderboard-panel">

        <button class="leaderboard-close" onclick="closeLeaderboard()">✕</button>

        <h1>Arcane Leaderboard</h1>

        <div id="leaderboardList" class="leaderboard-list">
          <p style="opacity:.6;">Loading rankings...</p>

      </div>

    </div>

  <script>
    /* =========================================================================
       USER DATA & AUTHENTICATION
       ========================================================================= */
    const username = localStorage.getItem("username");
    const major = localStorage.getItem("major");

    if (!username || !major) {
      window.location.href = "/login.html";
    }

    function getGuild(major) {
      if (major === "engineering") return "Mage Guild";
      if (major === "business") return "Merchant Guild";
      if (major === "arts") return "Artisan Guild";
      if (major === "medicine") return "Healer Guild";
      return "Unknown Guild";
    }

    function getGuildRoom() {
      return `guild_${major}`;
    }

    /* HEADER UI SETUP */
    document.getElementById("usernameDisplay").innerText = username;
    document.getElementById("guildDisplay").innerText = getGuild(major);
    document.getElementById("avatar").innerText = username.charAt(0).toUpperCase();

    const guildName = getGuild(major);
    let currentRoom = "global";
    let currentQuestionId = null;

    /* =========================================================================
       UI NAVIGATION & TOGGLES
       ========================================================================= */
    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("collapsed");
    }

    function showSection(section, btn) {
      document.getElementById("chatSection").style.display = "none";
      document.getElementById("questionsSection").style.display = "none";
      document.getElementById("createSection").style.display = "none";
      document.getElementById("myQuestionsSection").style.display = "none";
      document.getElementById("answerSingleSection").style.display = "none";

      document.getElementById(section + "Section").style.display = "flex";

      if (section === "myQuestions") loadMyQuestions();

      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");
    }

    function toggleRoomMenu() {
      const menu = document.getElementById("roomMenu");
      menu.style.display = menu.style.display === "block" ? "none" : "block";
    }

    function toggleActivePanel() {
      const panel = document.getElementById("activeUsersPanel");
      panel.classList.toggle("open");
    }

    function logout() {
      localStorage.clear();
      window.location.href = "/index.html";
    }

    /* =========================================================================
       CHAT LOGIC
       ========================================================================= */
    async function sendMessage() {
      const input = document.getElementById("chatInput");
      const message = input.value.trim();
      if (!message) return;
      await fetch("/send-message", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, room: currentRoom, message })
      });
      input.value = "";
      loadMessages();
    }

    async function loadMessages() {
      const res = await fetch(`/messages/${currentRoom}`);
      const messages = await res.json();
      const chatBox = document.getElementById("chatBox");
      const isNearBottom = chatBox.scrollTop + chatBox.clientHeight >= chatBox.scrollHeight - 50;
      chatBox.innerHTML = "";

      messages.forEach(msg => {
        const wrapper = document.createElement("div");
        wrapper.className = "msg-wrapper";

        let reactionsHtml = "";
        if (msg.reactionData) {
          for (const [emoji, data] of Object.entries(msg.reactionData)) {
            const userList = data.users.join(", ");
            reactionsHtml += `
              <div class="tooltip-container">
                  <button class="reaction-btn" style="margin-right:8px; border:1px solid #333; padding:2px 5px; border-radius:4px" onclick="toggleReaction(${msg.id}, '${emoji}')">
                      ${emoji} ${data.count}
                  </button>
                  <span class="tooltip-text">Reacted by: ${userList}</span>
              </div>
            `;
          }
        }

        let controlsHtml = `
          <div class="msg-controls">
            <button class="reaction-btn" onclick="toggleReaction(${msg.id}, '👍')">👍</button>
            <button class="reaction-btn" onclick="toggleReaction(${msg.id}, '❤️')">❤️</button>
            <button class="reaction-btn" onclick="toggleReaction(${msg.id}, '😂')">😂</button>
            ${msg.username === username ? `<button class="reaction-btn" onclick="deleteMessage(${msg.id})" style="color:red">❌</button>` : ''}
          </div>
        `;

        wrapper.innerHTML = `
          <div><strong>${msg.username}:</strong> ${msg.message.replace(/\n/g, "<br>")}</div>
          <div style="margin: 5px 0;">${reactionsHtml}</div>
          ${controlsHtml}
        `;
        chatBox.appendChild(wrapper);
      });

      if (isNearBottom) chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function deleteMessage(messageId) {
      if (!confirm("Are you sure you want to delete this message?")) return;
      await fetch("/delete-message", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messageId, username })
      });
      loadMessages();
    }

    async function toggleReaction(messageId, emoji) {
      await fetch("/toggle-reaction", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messageId, username, emoji })
      });
      loadMessages();
    }

    async function selectRoom(room) {
      currentRoom = room === "guild" ? getGuildRoom() : "global";
      document.getElementById("roomMenu").style.display = "none";
      await sendHeartbeat();
      loadMessages();
      updateChatTitle();
    }

    function updateChatTitle() {
      const title = document.getElementById("chatTitle");
      if (!title) return;
      if (currentRoom === "global") title.innerText = "World Chat";
      else if (currentRoom.startsWith("guild_")) title.innerText = `${getGuild(major)} Chat`;
      else title.innerText = "Chat";
    }

    /* =========================================================================
       QUESTION LOGIC
       ========================================================================= */

    document.querySelectorAll(".filter-pill").forEach(btn => {
      btn.addEventListener("click", () => {

        // cycle: none → include → exclude → none
        if (!btn.classList.contains("include") && !btn.classList.contains("exclude")) {
          btn.classList.add("include");

        } else if (btn.classList.contains("include")) {
          btn.classList.remove("include");
          btn.classList.add("exclude");

        } else {
          btn.classList.remove("exclude");
        }

        updateSelectedFiltersUI();
      });
    });

    function updateSelectedFiltersUI() {
      const includeDiv = document.getElementById("includeFilters");
      const excludeDiv = document.getElementById("excludeFilters");

      const all = document.querySelectorAll(".filter-pill");

      const include = [];
      const exclude = [];

      all.forEach(btn => {
        const text = btn.innerText;

        if (btn.classList.contains("include")) include.push(text);
        if (btn.classList.contains("exclude")) exclude.push(text);
      });

      includeDiv.innerHTML = include.map(i =>
        `<span class="filter-chip include">✓ ${i}</span>`
      ).join("");

      excludeDiv.innerHTML = exclude.map(i =>
        `<span class="filter-chip exclude">✖ ${i}</span>`
      ).join("");
    }

    async function startQuestions() {

      function getFilterValues(containerId) {
        const include = [];
        const exclude = [];

        const buttons = document.querySelectorAll(`#${containerId} .filter-pill`);

        buttons.forEach(btn => {
          const value = btn.dataset.value;

          if (btn.classList.contains("include")) include.push(value);
          if (btn.classList.contains("exclude")) exclude.push(value);
        });

        return { include, exclude };
      }

      const cat = getFilterValues("categoryFilter");
      const diff = getFilterValues("difficultyFilter");
      const guild = getFilterValues("guildFilter");

      const excludeAnswered = document.getElementById("excludeAnswered").checked;

      const res = await fetch("/questions-advanced", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          username,

          includeCategories: cat.include,
          excludeCategories: cat.exclude,

          includeDifficulties: diff.include,
          excludeDifficulties: diff.exclude,

          includeGuilds: guild.include,
          excludeGuilds: guild.exclude,

          excludeAnswered
        })
      });

      const data = await res.json();

      const questionText = document.getElementById("questionList");

      if (!data.length) {
        questionText.innerText = "No matching questions found.";
        currentQuestionId = null;
        return;
      }

      // Build selectable list
      questionText.innerHTML = data.map(q => `
        <div style="border:1px solid #5da9ff; padding:8px; margin-bottom:6px; border-radius:6px; cursor:pointer;"
            onclick="openQuestion(${q.id}, \`${q.question}\`)">
          ${q.question}
          ${q.answered ? '<span style="color:orange;"> (answered)</span>' : ''}
        </div>
      `).join("");
    }

    async function submitAnswer() {
      if (!currentQuestionId) {
        document.getElementById("resultText").innerText = "No question loaded.";
        return;
      }

      const answer = document.getElementById("answerInput").value;

      const res = await fetch("/answer-question", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, questionId: currentQuestionId, answer })
      });

      const data = await res.json();
      const resultText = document.getElementById("resultText");

      if (data.correct) {
        resultText.innerText = `Correct! +${data.xpGained} XP | Rank: ${data.rank}`;
        document.getElementById("answerInput").value = "";
        startQuestions();
      } else {
        resultText.innerText = data.message || "Wrong answer 😢";
      }
    }

    async function submitQuestion() {
      const question = document.getElementById("newQuestion").value;
      const answer = document.getElementById("newAnswer").value;
      const difficulty = document.getElementById("newDifficulty").value;
      const category = document.getElementById("newCategory").value;
      const res = await fetch("/add-question", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, answer, difficulty, category, username })
      });
      const text = await res.text();
      document.getElementById("createResult").innerText = text;
      document.getElementById("newQuestion").value = "";
      document.getElementById("newAnswer").value = "";
      document.getElementById("newCategory").value = "";
    }

    function selectQuestion(id, text) {
      currentQuestionId = id;
      document.getElementById("questionText").innerText = text;
    }
        /* =========================================================================
       QUESTION LOGIC, 
       ========================================================================= */

    async function loadMyQuestions() {
      const res = await fetch(`/my-questions/${username}`);
      const data = await res.json();

      const container = document.getElementById("myQuestionsList");

      if (!data.length) {
        container.innerHTML = "<p>No questions created yet.</p>";
        return;
      }

      container.innerHTML = data.map(q => `
        <div style="border:1px solid #5da9ff; padding:10px; margin-bottom:10px; border-radius:8px;">
          <strong>${q.question}</strong><br>
          <small>Answer: ${q.answer}</small><br>
          <small>${q.category} | ${q.difficulty}</small><br><br>

          <button onclick="editQuestion(${q.id}, '${q.question}', '${q.answer}', '${q.category}', '${q.difficulty}')">✏️ Edit</button>
          <button onclick="deleteQuestion(${q.id})" style="color:red;">❌ Delete</button>
        </div>
      `).join("");
    }

    async function deleteQuestion(id) {
      if (!confirm("Delete this question?")) return;

      await fetch("/delete-question", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ questionId: id, username })
      });

      loadMyQuestions();
    }

    async function editQuestion(id, oldQ, oldA, oldC, oldD) {
      const question = prompt("Edit question:", oldQ);
      const answer = prompt("Edit answer:", oldA);

      if (!question || !answer) return;

      await fetch("/edit-question", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          questionId: id,
          username,
          question,
          answer,
          category: oldC,
          difficulty: oldD
        })
      });

      loadMyQuestions();
    }

    function openQuestion(id, text) {
      currentQuestionId = id;

      document.getElementById("singleQuestionText").innerText = text;
      document.getElementById("singleAnswerInput").value = "";
      document.getElementById("singleResultText").innerText = "";

      // switch views
      document.getElementById("questionsSection").style.display = "none";
      document.getElementById("answerSingleSection").style.display = "flex";
    }

    function backToSearch() {
      document.getElementById("answerSingleSection").style.display = "none";
      document.getElementById("questionsSection").style.display = "flex";
    }

    async function submitSingleAnswer() {
      if (!currentQuestionId) {
        document.getElementById("singleResultText").innerText = "No question selected.";
        return;
      }

      const answer = document.getElementById("singleAnswerInput").value;

      const res = await fetch("/answer-question", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, questionId: currentQuestionId, answer })
      });

      const data = await res.json();

      if (data.correct) {
        document.getElementById("singleResultText").innerText =
          `Correct! +${data.xpGained} XP | Rank: ${data.rank}`;
      } else {
        document.getElementById("singleResultText").innerText =
          data.message || "Wrong answer 😢";
      }
    }
    /* =========================================================================
       NETWORKING & LIFECYCLE
       ========================================================================= */
    async function sendHeartbeat() {
      await fetch("/heartbeat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, guild: getGuild(major), room: currentRoom })
      });
    }

    async function updateActiveUsers() {
      const res = await fetch(`/active-users/${currentRoom}`);
      const users = await res.json();
      document.getElementById("activeCount").innerText = users.length;
      const listDiv = document.getElementById("activeUsersList");
      if (listDiv) {
        listDiv.innerHTML = users.length > 0 ? users.map(u => `<div>🟢 ${u.username}</div>`).join("") : "No one online";
      }
    }

    // Interval Timers
    setInterval(() => { sendHeartbeat(); updateActiveUsers(); }, 10000);
    setInterval(loadMessages, 3000);

    // Initial Load
    sendHeartbeat();
    updateActiveUsers();
    loadMessages();
    updateChatTitle();

    // Event Listeners
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === 'hidden') {
        const data = JSON.stringify({ username });
        navigator.sendBeacon('/go-offline', new Blob([data], { type: 'application/json' }));
      } else if (document.visibilityState === 'visible') {
        sendHeartbeat();
        updateActiveUsers();
      }
    });

    document.addEventListener("click", (e) => {
      const menu = document.getElementById("roomMenu");
      const btn = document.querySelector(".chat-dropbtn");
      if (menu && btn && !menu.contains(e.target) && !btn.contains(e.target)) {
        menu.style.display = "none";
      }
    });

    document.getElementById("chatInput").addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
        
    /* =========================================================
      LEADERBOARD
    ========================================================= */

    async function openLeaderboard() {

      const modal = document.getElementById("leaderboardModal");
      const list = document.getElementById("leaderboardList");

      modal.classList.add("show");

      list.innerHTML = `
        <p style="opacity:.6;">Loading rankings...</p>
      `;

      try {

        const res = await fetch("/leaderboard");

        const data = await res.json();

        if (!data.length) {
          list.innerHTML = "<p>No adventurers ranked yet.</p>";
          return;
        }

        list.innerHTML = "";

        data.forEach((user, index) => {

          const div = document.createElement("div");

          div.className = "leaderboard-entry";

          if (index === 0) {
            div.classList.add("top");
          }

          div.innerHTML = `
            <div class="lb-left">

              <div class="lb-rank">
                ${index === 0 ? "#1" : `#${index + 1}`}
              </div>

              <div>
                <div class="lb-user">
                  ${index === 0 ? "👑 " : ""}${user.username}
                </div>
                <div class="lb-title">${user.rank}</div>
              </div>

            </div>

            <div class="lb-xp">
              ${user.xp} XP
            </div>
          `;

          list.appendChild(div);

        });

      } catch (err) {

        list.innerHTML = `
          <p>Failed to load leaderboard.</p>
        `;

        console.error(err);
      }
    }

    function closeLeaderboard() {
      document
        .getElementById("leaderboardModal")
        .classList
        .remove("show");
    }

    /* click outside closes modal */
    document.addEventListener("click", (e) => {

      const modal = document.getElementById("leaderboardModal");

      if (e.target === modal) {
        closeLeaderboard();
      }
    });
  </script>
</body>
</html>
